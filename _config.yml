#REQUIRED
org_name: JESTARH EDUCATION ASSISTANCE PROGRAM
org_name_abbrev: JEAP
org_summary: > # Enter your summary on the next line. Be sure to indent by two spaces.
  JEAP is a grassroot, community-based nonprofit association dedicated to helping vulnerable children stay in school, learn with dignity, and build a brighter future. We believe every child deserves a fair chance to education.

org_full_description: |
  The JESTARH EDUCATION ASSISTANCE PROGRAM (JEAP) is a community-focused association 
  dedicated to improving educational opportunities and support systems for children in 
  Cameroon. At its core, JEAP provides access to quality learning for pupils from diverse 
  socio-economic backgrounds by ensuring that schools are equipped with appropriate 
  teaching and learning materials and resources.

  In addition to educational access, JEAP supports the financial and technical needs of 
  local schools to foster effective and sustainable operations. The association works to 
  enhance educational infrastructure and equipment, strengthening the overall learning 
  environment for students and teachers alike.

  JEAP is committed not only to academic support but also to community empowerment.

org_mission: "To empower underserved communities in Cameroon, by removing barriers to quality education through the provision of essential learning materials, infrastructure support, and holistic guidance for children and their families."


org_vision: "A world where every child in Cameroon, regardless of socio-economic background, has the tools and support to unlock their full potential and build a sustainable future."

