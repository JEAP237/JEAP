#REQUIRED
org_name: JESTARH EDUCATION ASSISTANCE PROGRAM
org_name_abbrev: JEAP
org_summary: > # Enter your summary on the next line. Be sure to indent by two spaces.
  JEAP is a registered grassroot, community-based nonprofit dedicated to helping vulnerable children stay in school, learn with dignity, and build a brighter future.


org_full_description: |
JESTARH Education Assistance Program (JEAP) is a registered grassroots community-based nonprofit organization with headquarters in Shisong, Bui Division, in the Northwest Region of Cameroon.

Through our integrated approach of providing essential school materials, supporting teachers, improving school infrastructure, and empowering parents and families to take an active role in their children’s education, we strive to address the everyday barriers that prevent children from learning and improve access to quality education.

By working closely with schools, community leaders, and local families, we ensure that our solutions are practical, sustainable, and rooted in the needs of the communities we serve.

At JEAP, we believe that every child deserves the opportunity to learn, grow, and build a brighter future; and we are dedicated to making that a reality.


org_mission: "To support the education needs of children, teachers, and schools in our communities by making quality learning more accessible by providing essential school materials, improving learning spaces, and offering guidance and support to children and their families."


org_vision: "A future where every child has an equal chance to learn, grow, and build a brighter future."

